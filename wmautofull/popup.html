<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WM Auto Baccarat Pro</title>
  <style>
    body {
      width: 320px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background: #0f121a;
      color: #f1f2f6;
    }
    
    h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #00f2fe, #4facfe, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-auto {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #34d399;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    
    .section {
      background: #171b26;
      border: 1px solid #232c3d;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 12px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid #232c3d;
      color: #94a3b8;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-row b {
      color: #00f2fe;
    }

    .info-row .status-on {
      color: #00ff88;
      font-weight: 700;
    }
    
    button.primary-btn {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #059669, #10b981);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 700;
      text-transform: uppercase;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
      transition: all 0.2s;
    }
    
    button.primary-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <h3>🎰 WM Auto Baccarat Pro</h3>
  
  <div class="badge-auto">
    <span>⚡ HOẠT ĐỘNG TỰ ĐỘNG 100%</span>
    <span style="color:#00f2fe;">KHÔNG CẦN CÀI URL</span>
  </div>

  <div class="section">
    <div class="info-row">
      <span>Trạng thái tiện ích:</span>
      <span class="status-on">● Đang Bật</span>
    </div>
    <div class="info-row">
      <span>Phạm vi chạy:</span>
      <b>Mọi trang web sảnh WM</b>
    </div>
    <div class="info-row">
      <span>Bảng điều khiển:</span>
      <span class="status-on">Tự hiện trên bàn cược</span>
    </div>
    <div class="info-row">
      <span>Lắng nghe WebSocket:</span>
      <span class="status-on">Kích hoạt sẵn</span>
    </div>
  </div>

  <button class="primary-btn" id="reload-tab-btn">🔄 Tải Lại Trang Web Này</button>
  
  <script src="popup.js"></script>
</body>
</html>
